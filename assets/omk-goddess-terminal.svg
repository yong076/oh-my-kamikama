<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Oh My Kamisama terminal goddess banner</title>
  <desc id="desc">Original parody-style banner for oh-my-kamikama: a celestial terminal conductor routes Claude, Gemini, Codex, OMX, and OMO into one command.</desc>
  <rect width="1200" height="520" rx="34" fill="#0C0D12"/>
  <path d="M0 380 C180 305 280 430 445 355 C615 275 725 392 890 310 C1038 237 1110 285 1200 248 V520 H0 Z" fill="#171B29"/>
  <circle cx="935" cy="115" r="72" fill="#F7D56B"/>
  <circle cx="935" cy="115" r="98" stroke="#F7D56B" stroke-opacity=".2" stroke-width="16"/>
  <g transform="translate(112 82)">
    <rect x="0" y="0" width="500" height="330" rx="22" fill="#111827" stroke="#2F394E" stroke-width="3"/>
    <rect x="0" y="0" width="500" height="54" rx="22" fill="#20283A"/>
    <circle cx="34" cy="28" r="8" fill="#FF6B6B"/>
    <circle cx="62" cy="28" r="8" fill="#F7D56B"/>
    <circle cx="90" cy="28" r="8" fill="#50D890"/>
    <text x="32" y="100" fill="#9BE7FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="28">$ omk "grant the feature"</text>
    <text x="32" y="150" fill="#D7E3FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">claude  -> risks</text>
    <text x="32" y="190" fill="#D7E3FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">gemini  -> second sight</text>
    <text x="32" y="230" fill="#D7E3FF" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">codex   -> build + verify</text>
    <text x="32" y="278" fill="#50D890" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23">status: blessed, not guessed</text>
  </g>
  <g transform="translate(705 116)">
    <path d="M138 0 C215 0 276 62 276 138 C276 215 215 276 138 276 C62 276 0 215 0 138 C0 62 62 0 138 0 Z" fill="#EEE7FF"/>
    <path d="M67 142 C50 82 88 39 139 39 C194 39 225 87 209 143 C249 165 250 235 190 258 C145 275 82 264 61 219 C47 190 49 164 67 142 Z" fill="#A98BFF"/>
    <path d="M94 118 C98 102 113 91 130 91 H153 C171 91 186 104 189 121 L195 157 C199 182 180 205 155 205 H123 C98 205 79 182 84 157 L94 118 Z" fill="#FFF9EF"/>
    <circle cx="121" cy="143" r="7" fill="#111827"/>
    <circle cx="163" cy="143" r="7" fill="#111827"/>
    <path d="M128 170 C138 179 151 179 161 170" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <path d="M100 76 C126 48 165 49 190 77" stroke="#F7D56B" stroke-width="10" stroke-linecap="round"/>
    <path d="M43 140 H15 M261 140 H233 M138 15 V-13 M74 42 L53 20 M202 42 L223 20" stroke="#F7D56B" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="704" y="430" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="800">OH MY KAMISAMA</text>
  <text x="707" y="470" fill="#AAB7D4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">One wish in. Many agents out.</text>
</svg>
